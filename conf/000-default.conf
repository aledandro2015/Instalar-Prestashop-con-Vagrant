<VirtualHost *:80>
    ServerName __DOMINIO__
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ps-http-error.log
    CustomLog ${APACHE_LOG_DIR}/ps-http-access.log combined
</VirtualHost>